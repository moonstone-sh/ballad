manifest_version = 2

[package]
name = "moonstone/ballad"
version = "0.3.14"
kind = "script"
description = "Deterministic Lua project exporter and bundler for Moonstone"

[origin]
kind = "git"
url = "https://github.com/moonstone-sh/ballad"

[interpreter]
name = "luajit"
version = "2.1.0"
abi = "5.1"

[[dependencies]]
name = "dkjson"
constraint = "rocks:dkjson@^2.9-1"
role = "runtime"

[[dependencies]]
name = "moonstone/clingy"
constraint = "^0.3.0"
role = "runtime"

[scripts]
play = 'lua src/main.lua play partiture.lua "$@"'
package-ballad-watch = 'lua src/main.lua play partiture.ballad-watch.lua "$@"'
help = "lua src/main.lua --help"
