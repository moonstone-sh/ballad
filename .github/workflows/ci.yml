name: Ballad CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ballad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          # Pinned to an explicit SHA, not a floating branch -- see
          # release.yml's own comment on this same checkout for why.
          ref: ce2b29cc0a3aaf4b5a5e7ce6b9d4f5986e2bf61a
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/ballad
          ref: main
          path: .ci/ballad-ci
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum zstd
      - name: Build Moonstone CLI
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Synchronize Ballad
        run: moon sync
      - name: Validate Ballad and export itself
        run: |
          moon exec sh -c '
            set -eu
            ./tests/test_layout_exec.sh
            ./tests/test_windows_portability.sh
            ./tests/test_windows_watcher_bridge.sh
            ./tests/test_native_closure.sh
            BALLAD_ROOT="$GITHUB_WORKSPACE" .ci/ballad-ci/tests/test_stage2.sh
            ./tests/test_watcher.sh
            ./tests/test_native_action.sh
            ./tests/test_invocation_args.sh
            ./tests/test_init.sh
            ./tests/test_conventions.sh
            ./tests/test_control_testing.sh
            ./tests/test_moonstone_contract.sh
            ./tests/test_orbit_report.sh
            ./tests/test_orbit_integration.sh
             ./tests/test_publish_verification.sh
             ./tests/test_registry_artifact_create.sh
             ./tests/test_registry_source_package.sh
            ./tests/test_runtime_registry.sh
          '
          moon run play
