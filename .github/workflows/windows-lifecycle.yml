name: Windows package lifecycle
on:
  pull_request:
  push:
    branches: [main, feat/windows-flavors]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: windows-latest
    env:
      MOONSTONE_TRACE_ERRORS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          ref: 8c3a451134672420a7d918ad92463b4a803637c6
          path: .ci/moonstone
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: .zig-cache
          key: moonstone-windows-b2f6d33-zig016
      - name: Build Moonstone
        working-directory: .ci/moonstone
        run: zig build
      - name: Synchronize actual package dependencies
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> $env:GITHUB_PATH
          & .ci/moonstone/zig-out/bin/moon.exe sync
          if ($LASTEXITCODE -ne 0) { throw 'moon sync failed' }
      - name: Native task and filesystem lifecycle
        run: |
          moon exec -- lua tests/windows/lifecycle.lua
          if ($LASTEXITCODE -ne 0) { throw 'native task lifecycle failed' }
      - name: Native orbit exports and flavor cache isolation
        run: |
          moon exec -- python tests/test_framework_flavors.py
          if ($LASTEXITCODE -ne 0) { throw 'native orbit/flavor contract failed' }
      - name: Export Ballad and run its relocated launcher
        shell: pwsh
        run: |
          moon exec -- lua src/main.lua play partiture.lua
          if ($LASTEXITCODE -ne 0) { throw 'Ballad export failed' }
          Copy-Item -Recurse dist/ballad "$env:RUNNER_TEMP/Ballad relocated"
          moon exec -- cmd /d /c "$env:RUNNER_TEMP/Ballad relocated/bin/ballad.cmd" --help
          if ($LASTEXITCODE -ne 0) { throw 'relocated launcher failed' }
